services:
  # ---- Backend (Express API) ----
  backend:
    build: ./backend
    container_name: aeva-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
    networks:
      - aeva-network

  # ---- Frontend (React + Nginx) ----
  frontend:
    build: ./frontend
    container_name: aeva-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aeva-network

networks:
  aeva-network:
    driver: bridge
